name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # If only a .zip was uploaded to the repo, unpack it
      - name: Unpack zip (if needed)
        run: |
          if [ -z "$(find . -name settings.gradle -not -path './.git/*')" ]; then
            z=$(find . -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$z" ]; then
              echo "Unpacking $z"
              unzip -oq "$z" -d _project
            fi
          fi

      # Finds the Gradle project wherever it was uploaded
      - name: Locate project
        id: find
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle not found. Upload the project files (or the .zip) to the repo."
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: totemhud
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.dir }}/build/libs/*.jar
